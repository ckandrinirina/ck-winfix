name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet test WinFix.sln

  build:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            project: src/WinFix
            built: WinFix.exe
            asset: WinFix.exe
          - os: macos-latest
            rid: osx-arm64
            project: src/WinFixUsb
            built: WinFixUsb
            asset: WinFixUsb-macos-arm64
          - os: macos-latest
            rid: osx-x64
            project: src/WinFixUsb
            built: WinFixUsb
            asset: WinFixUsb-macos-x64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Publish
        shell: bash
        run: |
          dotnet publish ${{ matrix.project }} -c Release -r ${{ matrix.rid }} --self-contained \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:Version=${GITHUB_REF_NAME#v} -o out
          mkdir dist
          cp out/${{ matrix.built }} dist/${{ matrix.asset }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/WinFix.exe
            dist/WinFixUsb-macos-arm64
            dist/WinFixUsb-macos-x64
